<!doctype html>
<html lang="en" data-theme="system">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Winget Portable</title>
        <link rel="stylesheet" href="styles.css" />
    </head>
    <body>
        <button id="openSettingsBtn" class="icon-btn">⚙️</button>

        <div class="container">
            <h1 data-i18n="title">Update Apps</h1>
            <p data-i18n="description">
                This tool will fetch and install the latest versions of your
                installed software.
            </p>

            <div class="actions">
                <button id="scanBtn" data-i18n="scanBtn">
                    Scan for updates
                </button>

                <button
                    id="updateSelectedBtn"
                    class="hidden"
                    data-i18n="updateSelectedBtn"
                    disabled
                >
                    Update Selected
                </button>
            </div>

            <div id="tableContainer" class="hidden">
                <div class="table-wrapper">
                    <table id="appsTable">
                        <thead>
                            <tr>
                                <th>
                                    <input
                                        type="checkbox"
                                        id="selectAll"
                                        checked
                                    />
                                </th>
                                <th data-i18n="colName">Name</th>
                                <th data-i18n="colCurrent">Current</th>
                                <th data-i18n="colNew">New</th>
                            </tr>
                        </thead>
                        <tbody id="tableBody"></tbody>
                    </table>
                </div>
            </div>

            <div id="loadingBarContainer" class="hidden">
                <div class="loading-bar"></div>
            </div>

            <pre id="output" data-state="ready" data-i18n="ready">
Ready to go...</pre
            >
        </div>

        <div id="settingsOverlay" class="overlay hidden">
            <div class="settings-panel">
                <h2 data-i18n="settingsTitle">Settings</h2>

                <div class="setting-item">
                    <select id="langSelect">
                        <option value="en">English</option>
                        <option value="pl">Polski</option>
                        <option value="es">Español</option>
                        <option value="de">Deutsch</option>
                        <option value="fr">Français</option>
                        <option value="it">Italiano</option>
                    </select>
                </div>

                <div class="setting-item switch-item">
                    <span data-i18n="autoAccept"
                        >Automatically accept all agreements</span
                    >
                    <label class="switch">
                        <input type="checkbox" id="autoAccept" checked />
                        <span class="slider"></span>
                    </label>
                </div>

                <div class="setting-item switch-item">
                    <span data-i18n="startupCheck"
                        >Check updates on startup</span
                    >
                    <label class="switch">
                        <input type="checkbox" id="startupCheck" checked />
                        <span class="slider"></span>
                    </label>
                </div>

                <div class="setting-item theme-section">
                    <button id="themeToggleBtn" data-i18n="themeBtn">
                        Toggle Theme
                    </button>
                </div>

                <div class="setting-item update-section">
                    <button id="checkUpdateBtn" data-i18n="checkAppUpdate">
                        Check for app updates
                    </button>
                    <span id="appUpdateStatus" class="update-status"></span>
                </div>

                <button
                    id="closeSettingsBtn"
                    data-i18n="closeBtn"
                    class="close-btn"
                >
                    Close
                </button>
            </div>
        </div>

        <script src="./i18n.js"></script>
        <script src="./main.js"></script>
    </body>
</html>
