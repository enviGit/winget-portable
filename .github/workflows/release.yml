name: Release
on:
  push:
    tags:
      - "v*"
jobs:
  build_release:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check branch
        run: |
          $branches = git branch -r --contains ${{ github.sha }}
          if ($branches -notmatch "origin/main") {
            Write-Error "Wrong branch. Terminating."
            exit 1
          }

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install dependencies
        run: npm install

      - name: Build and release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: app-v__VERSION__
          releaseName: "Winget v__VERSION__"
          releaseBody: "Automatic portable version."
          releaseDraft: false
          prerelease: false
          includeBundle: false
          includeRelease: true
